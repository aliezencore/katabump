name: "@s5gydl kata 自动续期任务"

on:
  schedule:
    # 每 12 小时一次：UTC 21:20 / 09:20 = 北京时间 05:20 / 17:20
    # 为什么提前到 05:20 而不是贴着 07:30：
    #   实测本仓库 GitHub schedule 延迟 102~131 分钟（中位约 111 分钟）。
    #   若按 07:20 起跑，实际到达已约 09:10 —— 窗口(07:30)过了 1h40m，只能事后补救。
    #   提前到 05:20 后，无论延迟 0 还是 2 小时，到达时刻都落在窗口之前，
    #   脚本会在作业内等到窗口真正开启再点 Renew（见 RENEW_EARLY_WAIT_MIN / RETRY_BUDGET_MIN）。
    - cron: '20 21,9 * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      debug:
        description: '开启 Debug 模态框截图 Telegram 实时推送'
        required: false
        type: boolean
        default: false

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        # 将 USERS_JSON 配置在 GitHub Repository Secrets 中
        # 格式: [{"username": "xxx", "password": "xxx"}, ...]
        USERS_JSON: ${{ secrets.USERS_JSON || secrets.USERS }}
        USERS: ${{ secrets.USERS || secrets.USERS_JSON }}
        # 代理变量（只需配置 PROXY_URL 或 SUB_URL 其中一个即可，脚本自动智能解析订阅/S5/TG等任意格式）
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SUB_URL: ${{ secrets.SUB_URL }}
        S5_URL: ${{ secrets.S5_URL }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        # 续期窗口参数（都有内置默认值，不配也能跑；如需覆盖再在 Secrets 里加同名变量）
        # SITE_TZ=站点时区，决定「日期」如何换算成绝对时刻，避免 runner(UTC) 与本地的 8 小时错位
        SITE_TZ: ${{ secrets.SITE_TZ || 'Asia/Shanghai' }}
        # RENEW_CYCLE_HOURS=站点续期周期（小时），站点为每 4 天一次
        RENEW_CYCLE_HOURS: ${{ secrets.RENEW_CYCLE_HOURS || '96' }}
        # RENEW_ANCHOR_TIME=旧数据无「成功时刻」时，把站点日期当作该时刻开启窗口
        RENEW_ANCHOR_TIME: ${{ secrets.RENEW_ANCHOR_TIME || '07:30' }}
        # RENEW_EARLY_WAIT_MIN=距窗口多少分钟内就在本次作业里等到开启（而不是跳过）
        # 默认 240 分钟：需覆盖「零延迟到达」时的整段空档（05:20 到达 → 07:30 窗口）
        RENEW_EARLY_WAIT_MIN: ${{ secrets.RENEW_EARLY_WAIT_MIN || '240' }}
        # RENEW_RETRY_BUDGET_MIN=作业内等待窗口的预算（分钟），GitHub 单 job 上限 6 小时
        RENEW_RETRY_BUDGET_MIN: ${{ secrets.RENEW_RETRY_BUDGET_MIN || '300' }}
        DEBUG_SCREENSHOT: ${{ inputs.debug || secrets.DEBUG_SCREENSHOT || secrets.DEBUG || 'false' }}
        DEBUG: ${{ inputs.debug || secrets.DEBUG || secrets.DEBUG_SCREENSHOT || 'false' }}
      # 使用 xvfb-run 模拟有头环境运行
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node kata_renew.js

    - name: Commit Renew Dates
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add renew_dates.json || true
        git diff --cached --quiet renew_dates.json || git commit -m "chore: update renew dates [skip ci]"
        for i in {1..5}; do
          git pull --rebase --autostash || true
          if git push; then
            break
          fi
          echo "⚠️ Push failed, retrying in 5 seconds ($i/5)..."
          sleep 5
        done

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/